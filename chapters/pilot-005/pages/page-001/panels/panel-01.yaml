swimsuit_continuity: Swimsuit designs carry forward from chapters/pilot-003/pages/page-002/art/beach-volleyball.jpg — Intel royal blue with gold trim, AMD red and black athletic two-piece, Nvidia black with green circuit traces — with crown, goggles, braid and palettes taken from the character sheets.
direction: "Single 4:3 landscape manga panel, full-bleed, no border. Comedy beach-volleyball scene on a sunny tropical beach: white sand, turquoise surf, blue sky with small clouds, a volleyball net, palm trees at the edges. The reference image is a three-column design sheet — LEFT Intel, MIDDLE AMD, RIGHT Nvidia — with full-body turnarounds above and expression heads below. Use it only for faces, hair, eye colour, body type, accessories and palettes. Do not copy the sheet layout, its white background, its text, or its outfits. LEFT, Intel: very long wavy light-blue hair to her thighs, pale blue eyes, pointed sapphire-and-gold crown, tall elegant build. Royal-blue one-piece athletic swimsuit with white side panels and thin gold trim, high neckline, small gold oval emblem at the hip. MIDDLE, AMD: bright red high ponytail with thin braided strands and gold beads, amber eyes, lean athletic build. Red-and-black two-piece athletic swimsuit: black sports top with red trim, black high-waist shorts, red bands around one thigh, black choker with a small red badge. RIGHT, Nvidia: thick emerald-green braid past her hips, green eyes, green-framed goggles pushed up on her head, strong muscular shoulders and arms. Black one-piece athletic swimsuit with high-cut legs, no skirt, thin neon-green circuit traces, dark green wristbands. Court layout: the net stretches across the frame on a slight diagonal, passing behind Intel and AMD but clearly IN FRONT of Nvidia — she is on the far side of the net, her body partly seen through the mesh, while Intel and AMD are on the near side with nothing between them and the camera. Action, mid-rally. On the RIGHT, behind the net, Nvidia is airborne at the top of a spike, body arched, spiking arm cocked high, a smug sideways grin. In the CENTRE, low over the sand, AMD dives with one arm stretched out, sand spraying, teeth gritted in frustration, eyes on the ball. On the LEFT, Intel recoils with both forearms raised, stiff and off balance, crown slipping, eyes wide and flustered. Exactly ONE volleyball in the whole panel, high in the air near the net between Nvidia's palm and Intel, with speed lines. CRITICAL: all three women are completely barefoot — bare toes and soles clearly visible on the sand. No shoes, sneakers, sandals, boots, socks or wraps anywhere; no gloves either, all hands are bare. Style: Silicon Wars seinen manga — crisp ink linework, cel shading with light screentone, glossy summer highlights, detailed swimwear seams, saturated summer palette, comedic energy. Composition: 4:3 landscape. Keep the top quarter as clean open sky and distant sea for speech balloons. Faces unobstructed, three silhouettes separated, believable hands and feet, correct anatomy. No lettering, no speech balloons, no text, no watermark, no type logos, no panel border, not a character sheet, not a lineup, not a collage."
framing: "4:3 landscape full-bleed art, 2304x1728 source, fitted to the 2240x1640 panel of layouts/single-panel-4x3.yaml. The fit trims about 2% of the height; heads, crown and ball stay well inside the panel. Balloon space sits in the open sky above Intel and above the net."
