direction: "Single 4:3 landscape manga panel, full-bleed, no border. Comedy scene inside an immense memory-chip warehouse: towering server racks of glowing stacked memory modules, pallets of DRAM sticks, shrink-wrapped NAND crates, warm dusty light shafts, thin haze. The reference image is a 2x2 sheet of four Silicon Wars character designs — use it for identity and costume only, never copy its grid or backgrounds. Top-left: OpenAI, elementary-school girl, fluffy silver-white side ponytail, huge navy knot ribbon with glowing cyan edges, white sailor blouse with navy collar, teal tie, navy skirt, navy backpack with a little white robot. Top-right: Micron, adult cowgirl, honey-blonde braid, cream cowboy hat with iridescent band, fringed cream vest with chip-shaped sheriff star, iridescent violet neckerchief, jeans, DIMM holstered at hip, tan boots with gear spurs. Bottom-left: Samsung, adult woman, sleek waist-length near-black hair with sapphire ribbons, white and ice-silver hanbok with wide sleeves and full flared skirt with glowing circuit hems, white SAMSUNG sash, norigae of tiny phones. Bottom-right: SK hynix, adult woman, violet-black updo with gold pin and crystal cubes, red-orange jeogori, slim column skirt fading red-orange to charcoal with tiered stacked hem, cream SK hynix sash, holding a small glowing stack of memory chips. Action: lower foreground left of center, OpenAI kneels on the concrete floor, tiny in frame, both hands clasped high begging, huge teary eyes, mouth open in a plea, ribbon drooping, an empty metal tray and scattered memory modules before her. Above and behind, on a low loading platform, three tall elegant memory queens look down at her: LEFT Micron, one hand on her hat brim, brow raised, friendly but reluctant; CENTER Samsung, one wide sleeve lifted in a grand welcoming gesture, proud half-smile; RIGHT SK hynix, holding her glowing memory stack to her chest, narrow violet eyes, slight pressed smile. Style: seinen manga, clean decisive ink lines, cel shading with light screentone, rich costume and industrial detail, warm amber light against cool cyan and violet glows. Composition: three women fill the upper two thirds, heads at y≈0.26 and x≈0.18 / 0.50 / 0.82; OpenAI small at x≈0.36, y≈0.78. Keep clear dark ceiling space above each head for speech balloons. Faces unobstructed, silhouettes separated, believable hands. No lettering, no speech balloons, no text, no watermark, no panel border, not a character sheet, not a collage."
framing: "4:3 landscape full-bleed art, 2304x1728 source. Balloon space is painted into the upper band above the three queens and the dark platform face beside OpenAI; keep faces inside the central 90% so the 4:3 fit crop never clips them."
