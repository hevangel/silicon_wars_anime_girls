direction: "Exactly four girls in the Citadel courtyard, one single scene, no face swaps. In the FOREGROUND CENTER, kneeling low in a dramatic begging pose, OpenAI from Image 1 (elementary-school girl with a fluffy silver-white side ponytail, blue-teal eyes, navy knot ribbon with glowing cyan edges, white-and-navy sailor uniform with teal tie, experiment backpack with a little white robot peeking out) — she kneels with both hands clasped together in front of her face, begging with huge teary pleading eyes looking up, her face near x=0.50 y=0.62. Standing over her in a loose arc, three memory makers look down at her. On the LEFT, Micron from Image 2 (adult woman, honey-blonde long side braid, cream cowboy hat, fringed cream vest with a chip-shaped sheriff star, DIMM holstered at her hip, glowing memory-bus lasso coiled in one hand) stands arms crossed with one eyebrow raised, unimpressed, her face near x=0.17 y=0.30. In the CENTER-RIGHT, Samsung from Image 3 (adult woman, sleek near-black hair with indigo sheen and sapphire daenggi ribbons, luminous white and ice-silver hanbok with a very full flared skirt, sash, norigae overloaded with tiny gadgets) stands with one hand on her hip and the other raised in a grand gesture, half-amused and half-exasperated, her face near x=0.66 y=0.27. On the RIGHT, SK hynix from Image 4 (adult woman, violet-black hair in a tall updo with a diagonal gold binyeo and crystal cubes, fitted red-orange jeogori and a slim column skirt grading red-orange to charcoal, glowing orange-gold HBM stack resting on her open palm, small notebook in her other hand) looks down with a narrow, quietly intense deadpan stare, her face near x=0.87 y=0.30. Leave clear dark open space in the upper left corner, the upper center, and the upper right for speech balloons, and clear open space just above the kneeling girl's head for one speech balloon. No lettering, no text anywhere."
framing: "Use a horizontal landscape canvas, 4:3. Keep all four faces, the kneeling pose, the lasso, and the HBM stack inside the frame; keep vital details away from the edges."
