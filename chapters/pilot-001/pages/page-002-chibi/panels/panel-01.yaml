id: panel-01
style_variant: chibi
title: The Tug of War (Chibi Test)
camera: Wide three-shot, single splash panel, chibi style variant test of page-002
characters: [intel, amd, nvidia]
references: [characters/intel/chibi_sheet.png, characters/amd/chibi_sheet.png, characters/nvidia/chibi_sheet.png]
dialogue_ids: [b01, b02, b03]
crop_center: [0.5, 0.34]
art: chapters/pilot-001/pages/page-002-chibi/art/panel-01.png
direction: "Exactly three chibi characters in a simplified cute version of the x86 Citadel testing courtyard, one single scene. A thick rope runs horizontally across the frame with a knot at its center, its left end held by Nvidia alone and its right end by the pair, the rope taut and angled slightly down toward the pair, who are losing. On the LEFT, chibi Nvidia from Image 3 (long green braid, goggles pushed up on her head, black leather jacket-dress with green seams) stands completely relaxed and upright in three-quarter view FACING RIGHT toward her opponents, a smug deadpan grin on her face: her RIGHT hand, on the side toward the rope's center, grips the rope firmly down at her side with one hand only, not leaning at all, while her LEFT hand casually curls a comically massive dark dumbbell up beside her head, the enormous weight clearly effortless for her; the dumbbell sits at the far left edge of the frame and is partly cropped by it. On the RIGHT, chibi Intel from Image 1 (long light-blue hair, sapphire crown, royal-blue and cream imperial military coat, white gloves) and chibi AMD from Image 2 (bright red braided high ponytail, amber eyes, black-and-crimson tactical jacket, headphones at her neck) stand side by side TOGETHER as one team, both in three-quarter view FACING LEFT toward Nvidia, faces turned left and looking at her, while their bodies lean back hard to the RIGHT, both gripping the rope hand over hand, feet sliding, faces flushed and straining, eyes squeezed shut, with big cartoon sweat drops flying. Leave clear light open sky space in the upper area of the frame for speech balloons. No lettering, no text, no speech balloons drawn anywhere."
framing: "Use a vertical portrait canvas, about 4:5. Keep all three faces, both rope grips, the full dumbbell, and all three chibi figures inside a central 4:5 crop; keep vital details away from the edges."
notes:
  - Chibi test variant of page-002 (brief panel-01) at the user's direction: Nvidia pulls against Intel and AMD TOGETHER, one hand on the rope and her other hand curling a dumbbell, while the pair strain with flying sweat.
  - Take 3 (current art) mirrors the staging at the user's direction — Nvidia stands on the LEFT facing right, her right hand gripping the rope down at her side and her left hand curling the dumbbell; the pair are on the right facing left. Earlier takes are kept as art/panel-01-take1.png (pair front-facing) and art/panel-01-take2.png (Nvidia on the right).
  - Take-3 nits recorded in qa.yaml — the dumbbell is partly cropped by the left frame edge, and the sky band is narrow, so her balloon tail is long.
  - Nvidia's line was rephrased cute at the user's request (see lettering.yaml b03); Intel and AMD keep their original page-002 shouts.
  - crop_center is 0.34: the 4:5 page fit frames the sky band at the top so the staggered balloons sit over sky.
