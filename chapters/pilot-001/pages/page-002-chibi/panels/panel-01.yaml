art: chapters/pilot-001/pages/page-002-chibi/art/panel-01.png
direction: "Exactly three chibi characters in a simplified cute version of the x86 Citadel testing courtyard, one single scene. A thick rope runs horizontally across the frame with a knot at its center, its left end held by the pair and its right end by Nvidia alone, the rope taut and angled slightly down toward the pair, who are losing. On the LEFT, chibi Intel from Image 1 (long light-blue hair, sapphire crown, royal-blue and cream imperial military coat, white gloves) and chibi AMD from Image 2 (bright red braided high ponytail, amber eyes, black-and-crimson tactical jacket, headphones at her neck) stand side by side TOGETHER as one team, both shown in three-quarter view FACING RIGHT toward their opponent, faces turned right and looking at her, while their bodies lean back hard to the LEFT, both gripping the rope hand over hand, feet sliding, faces flushed and straining, eyes squeezed shut, with big cartoon sweat drops flying. On the RIGHT, chibi Nvidia from Image 3 (long green braid, goggles pushed up on her head, black leather jacket-dress with green seams) stands completely relaxed and upright, facing LEFT toward them with a smug deadpan grin, gripping the same rope with ONE tiny hand at her side without leaning at all, while her OTHER hand casually curls a comically massive dark dumbbell up beside her head, the enormous weight clearly effortless for her. Leave clear light open sky space in the upper area of the frame for speech balloons. No lettering, no text, no speech balloons drawn anywhere."
framing: "Use a vertical portrait canvas, about 4:5. Keep all three faces, both rope grips, the full dumbbell, and all three chibi figures inside a central 4:5 crop; keep vital details away from the edges."
notes:
  - Chibi test variant of page-002 (brief panel-01) at the user's direction: Nvidia now pulls against Intel and AMD TOGETHER, one hand on the rope and her other hand curling a dumbbell, while the pair strain with flying sweat.
  - Take 2 (current art) fixes the facing the user flagged on take 1 (art/panel-01-take1.png, kept for reference) — the pair now face RIGHT toward Nvidia in three-quarter view while leaning back left; AMD's face is fully turned to her. Take-2 trade-offs recorded in qa.yaml — Nvidia's rope grip reads at the central knot rather than at her side, and Intel's gloves render skin-toned.
  - Nvidia's line was rephrased cute at the user's request (see lettering.yaml b03); Intel and AMD keep their original page-002 shouts.
  - crop_center is 0.34 for take 2: the 4:5 page fit frames the wide sky band at the top so the staggered balloons sit over sky.
