direction: "Exactly three adult women in the x86 Citadel testing courtyard, one single scene, no faces swap. A taut thick rope runs horizontally across the middle of the frame at about y=0.40. On the LEFT, Intel from Image 1 (long light-blue hair, sapphire crown, royal-blue and cream imperial military coat with gold-fringed epaulettes, white gloves) leans back hard to the left, both gloved hands gripping the rope, boots braced, straining with proud irritation, her face near x=0.24 y=0.32. On the RIGHT, AMD from Image 2 (fiery red high ponytail, amber eyes, black-and-crimson tactical jacket, headphones at her neck, fingerless gloves) leans back hard to the right, both hands gripping the other end of the same rope, boots braced, straining with a cocky grin, her face near x=0.76 y=0.32. The rope stays visibly deadlocked between them, neither side winning. In the FOREGROUND CENTER, larger in frame, Nvidia from Image 3 (thick emerald-green braid, goggles up in her hair, strong forearms, black leather jacket-dress with glowing green circuit seams) sits sideways-on and unbothered on a dark steel testing block below the rope, legs crossed at the boots, smugly watching them. With ONE hand she casually holds a comically massive dark-steel dumbbell raised beside her head, elbow bent, the weight clearly enormous and clearly effortless for her; her other hand rests loose on her knee. Her face is near x=0.50 y=0.64, grinning at the viewer. Leave clear dark open space in the upper left and upper right corners above Intel and AMD for short speech balloons, and clear dark open space in the center between the rope and Nvidia's head for one longer speech balloon. No lettering, no text anywhere."
framing: "Use a vertical portrait canvas, about 4:5. Keep all three faces, both rope grips, the full dumbbell, and Nvidia's seated figure inside a central 4:5 crop; keep vital details away from the edges."
