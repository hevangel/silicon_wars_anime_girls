id: panel-01
style_variant: chibi
title: The One-Handed Tug of War
camera: Wide three-shot, single 4:3 splash panel, chibi style variant
characters: [intel, amd, nvidia]
references: [characters/intel/chibi_sheet.png, characters/amd/chibi_sheet.png, characters/nvidia/chibi_sheet.png]
dialogue_ids: [b01]
crop_center: [0.5, 0.5]
art: chapters/pilot-001/pages/page-002-chibi-4x3/art/panel-01.png
direction: "Exactly one single 4:3 landscape chibi manga panel, full-bleed, no border. A tug of war between three super-deformed Silicon Wars girls in the x86 Citadel testing courtyard: pale stone paving, steel gantries, the processor-socket gate behind them, open sky above. The reference image is a grid of chibi turnarounds, front and three-quarter views, left to right Intel, AMD, Nvidia. Use it for face, hair, proportions, and costume only; never copy its grid, labels, text, or background. LEFT THIRD, Nvidia (third reference column): long thick emerald-green braid, black goggles pushed up in her hair, black leather motorcycle jacket-dress with a wide belt and glowing green circuit seams, heavy black boots. She stands about one quarter of the way into the frame, upright and completely relaxed in three-quarter view facing right, feet planted flat, body vertical, not leaning. Her RIGHT fist grips the rope low beside her hip and is the very end of the rope: the rope stops at her fist and carries nothing beyond it toward the left edge. Her LEFT arm lifts a comically massive dark dumbbell straight up beside her head in a hammer curl, as if it weighed nothing, fully inside the frame with clear stone visible to its left. Her face is a smug, half-lidded, deadpan show-off grin, both eyes open, no wink. CENTER: the thick frayed rope runs straight and fully taut from her fist across the frame, angled slightly down toward the right, with a fat knot just past the middle. RIGHT SIDE, Intel and AMD (first and second reference columns) side by side as one losing team, both facing left toward Nvidia in three-quarter view, arms stretched straight and taut on the rope, both gripping it hand over hand. Both are being dragged: bodies tilted back away from Nvidia at a steep diagonal, knees bent, boots skidding forward across the paving, dust trails behind their heels. Intel: long light-blue wavy hair, sapphire-and-gold crown, royal-blue and cream imperial military coat-dress with gold epaulettes, white gloves, dark boots; her face screwed up with effort, eyes squeezed shut, brows down, mouth open shouting, cheeks flushed, big cartoon sweat drops flying. AMD: bright red braided high ponytail with gold beads, amber eyes, black-and-crimson tactical jacket, headphones around her neck, fingerless gloves, chunky red-and-black boots; her face is bright red with strain, eyes squeezed shut, mouth wide open in a yell, sweat pouring, her heels skidding, her body tilted back - no smile and no confident grin on her. Feet stay flat on the ground with no crossed legs and no kneeling. Chibi proportions: about 2.5 heads tall, head 40 percent of standing height, short simplified limbs, small rounded hands and feet. Composition: heads at roughly x 0.2, 0.62, 0.85 in the upper half, rope and both grips visible, whole dumbbell in frame, open sky in the top band. No lettering, no speech balloons, no text, no watermark, no panel border, not a character sheet, not a collage."
framing: "4:3 landscape full-bleed art. Keep the three faces, both rope grips, and the whole dumbbell inside the central 92 percent of the frame so the 4:3 fit crop never clips them; keep the top band open sky for lettering. Chibi style, not realistic anatomy."
notes:
  - 4:3 chibi staging of page 002 at the user's direction: Nvidia pulls against Intel and AMD together with one hand while her other hand curls a dumbbell; the pair strain and lose ground.
  - Nvidia stands on the LEFT facing right and grips the rope with her right fist; Intel and AMD are together on the right facing left.
  - Distinct from pages/page-002-chibi, which is a 4:5 portrait staging of the same beat.
