<!doctype html><html lang="en"><meta charset="utf-8"><title>Rotoscope storyboard #75</title><style>body{margin:0;background:#0c1528;color:#f4f7ff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}svg{width:100%;border:1px solid #7389b7;border-radius:9px;background:#152646}input{width:72%}a{color:#ade4ff}</style><main><h1>Rotoscope timing guide (no recorded actor)</h1><p>Left: procedural anonymous driver pose. Right: original AMD vector schematic following matching timecode. This is a proof of timecode and guide geometry, not actual footage tracing.</p><svg viewBox="0 0 960 540"><path d="M480 0V540" stroke="#7991bb" stroke-dasharray="8 8"/><g id="driver" transform="translate(205 245)"><circle cx="0" cy="-75" r="38" fill="#decba7"/><path d="M0-35V90M0 90L-47 175M0 90L45 175" stroke="#d1dceb" stroke-width="14" fill="none"/><path id="darm" d="M0 0L100 -70" stroke="#d2dfef" stroke-width="13"/></g><g id="amd" transform="translate(700 260)"><path d="M-70 185L-62 28L70 28L72 185Z" fill="#8c3048" stroke="#e9c996" stroke-width="7"/><path d="M-64 20Q-88-160 0-160Q82-150 65 20" fill="#d04256"/><ellipse cy="-81" rx="53" ry="66" fill="#f5d2c1"/><path d="M48-127Q154-120 119-39" fill="none" stroke="#b8314a" stroke-dasharray="13 6" stroke-width="23"/><path id="aarm" d="M40 70L125-5" stroke="#a84053" stroke-width="24"/></g><text x="30" y="48" font-family="sans-serif" font-size="25" fill="#e5f0ff">PROCEDURAL DRIVER (ANONYMOUS)</text><text x="507" y="48" font-family="sans-serif" font-size="25" fill="#ebccd1">AMD RETARGET SKETCH</text><text id="frame" x="30" y="507" font-family="sans-serif" font-size="23" fill="#f9db99"></text></svg><div><input id="seek" type="range" min="0" max="143" value="0"><button id="play">Pause</button></div><p><a href="driver-poses.json">Keypose/timecode source</a> · <a href="reference-board.svg">Review board</a></p><script>let f=0,playing=true,last=0;const seek=document.getElementById("seek");function draw(){let p=f/143,angle=p*112;document.getElementById("driver").setAttribute("transform","translate("+(205+p*65)+" 245) rotate("+(p*7)+" 0 0)");document.getElementById("darm").setAttribute("transform","rotate("+angle+" 0 0)");document.getElementById("aarm").setAttribute("transform","rotate("+angle+" 40 70)");document.getElementById("frame").textContent="Timecode: "+String(Math.floor(f/24)).padStart(2,"0")+":"+String(f%24).padStart(2,"0")+" / 24fps";seek.value=f}function tick(t){if(playing&&last)f=(f+Math.floor(Math.min(100,t-last)*24/1000))%144;last=t;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);seek.oninput=()=>{f=Number(seek.value);playing=false;draw()};document.getElementById("play").onclick=()=>{playing=!playing;document.getElementById("play").textContent=playing?"Pause":"Play"};</script></main></html>
