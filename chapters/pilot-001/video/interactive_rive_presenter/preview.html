<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>#84 presenter controller</title><style>body{background:#0a1832;color:#edf4ff;margin:0;font:16px system-ui}main{max-width:1050px;margin:auto;padding:24px}svg{width:100%;border:1px solid #789ac8;border-radius:12px}button{background:#295489;color:white;border:1px solid #9ec9e8;border-radius:7px;padding:11px;margin:4px;cursor:pointer}pre{background:#091020;padding:15px;overflow:auto}a{color:#a5dcff}</style><main><h1>Intel · typed presenter control state machine</h1><p>Buttons enqueue bounded commands; invalid commands are rejected and reset/cancel are safe. Vector preview is a schematic instead of a .riv file.</p><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#112341"/><path d="M0 445H960" stroke="#637d9f" stroke-width="6"/><g id="avatar"><path d="M287 445L260 279L462 279L514 445Z" fill="#325d96" stroke="#eacb83" stroke-width="8"/><path d="M285 284Q260 93 380 71Q504 96 467 284" fill="#9ad0f2"/><ellipse cx="384" cy="208" rx="94" ry="113" fill="#f5d9c7"/><path d="M297 166Q296 82 388 86Q473 93 467 166" fill="#96cffa"/><path d="M319 98L346 57L370 89L403 48L433 100" fill="#3d8dbf" stroke="#ebcd84" stroke-width="7"/><g id="eyes"><ellipse cx="349" cy="204" rx="17" ry="12" fill="white"/><ellipse cx="424" cy="204" rx="17" ry="12" fill="white"/><circle cx="351" cy="205" r="9" fill="#2c7bb4"/><circle cx="425" cy="205" r="9" fill="#2c7bb4"/></g><path id="mouth" d="M366 262Q385 268 402 262" stroke="#9c5261" stroke-width="6" fill="none"/><g id="hand"><path d="M469 309L575 210" stroke="#3c649c" stroke-width="33"/><circle cx="575" cy="210" r="22" fill="#f2d3c2"/></g></g><rect x="610" y="130" width="310" height="260" rx="17" fill="#233b5d"/><text x="638" y="183" font-family="sans-serif" font-size="23" fill="#edcc9c">x86 COMPATIBILITY</text><text x="642" y="234" font-family="sans-serif" font-size="18" fill="white">Old code</text><path d="M643 248H872" stroke="#aac3e1" stroke-width="4"/><text x="642" y="296" font-family="sans-serif" font-size="18" fill="white">New hardware</text><path d="M643 306H872" stroke="#aac3e1" stroke-width="4"/></svg><div><button data-cmd="expression:skeptical">Skeptical</button><button data-cmd="expression:smile">Smile</button><button data-cmd="gesture:point">Point</button><button data-cmd="gesture:open_hand">Open hand</button><button data-cmd="talking:true">Talk</button><button id="replay">Script replay</button><button id="cancel">Cancel queue</button><button id="reset">Reset</button></div><pre id="status">Loading...</pre><p><a href="replay.json">Scripted replay</a> · <a href="controller.js">Generic controller source</a> · <a href="reference-board.svg">Visual board</a></p><script type="module">
import {PresenterMachine} from "./controller.js";
const p=new PresenterMachine(),el=id=>document.getElementById(id);
let last=0,acc=0,frame=0,failures=0;
function paint(){const s=p.state;el("avatar").setAttribute("transform",s.gaze==="left"?"translate(-15 0)":s.gaze==="right"?"translate(15 0)":"");el("hand").setAttribute("transform",s.gesture==="point"?"rotate(-25 469 309)":s.gesture==="open_hand"?"rotate(25 469 309)":"");el("mouth").setAttribute("d",s.talking?"M369 263Q384 310 405 263Z":s.expression==="smile"?"M363 263Q385 293 411 263":"M369 264Q385 269 402 264");el("eyes").setAttribute("transform",s.expression==="skeptical"?"translate(0 -11)":"");el("status").textContent=JSON.stringify({frame,state:s,queue:p.queue.length,remaining:p.remaining,invalid_commands_rejected:failures},null,2)}
function tick(t){if(last){acc+=Math.min(100,t-last);let steps=Math.floor(acc*24/1000);if(steps){for(let i=0;i<steps;i++){p.tick();frame++}acc-=steps*1000/24}}last=t;paint();requestAnimationFrame(tick)}
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{const [type,value]=b.dataset.cmd.split(":");try{p.enqueue({type,value:type==="talking"?value==="true":value,duration_frames:48})}catch(e){failures++;el("status").textContent=e.message}});
el("cancel").onclick=()=>p.cancel();el("reset").onclick=()=>{p.reset();frame=0};
el("replay").onclick=async()=>{let data=await(await fetch("replay.json")).json();p.reset();frame=0;for(const command of data.commands)p.enqueue(command)};
requestAnimationFrame(tick);
</script></main></html>
