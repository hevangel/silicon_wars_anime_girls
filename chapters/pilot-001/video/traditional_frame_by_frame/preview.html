<!doctype html><html lang="en"><meta charset="utf-8"><title>Flipbook #74</title><style>body{background:#0c1629;color:#f1f5ff;font:18px system-ui}main{max-width:1100px;margin:auto}img{width:100%;border-radius:12px;border:1px solid #748ab5}button{padding:10px}input{width:65%}a{color:#b3dfff}</style><main><h1>Traditional animation · hand-authored key drawings</h1><p>Six SVG blocking poses held for 24 frames each (on ones for the drawing change); not polished anime cels.</p><img id="shot" src="keys/key-01.svg" alt="Key-pose flipbook"><div><button id="play">Pause</button><input id="seek" type="range" min="0" max="143" value="0"><output id="caption">frame 0</output></div><p><a href="exposure.csv">Exposure sheet</a> · <a href="scene.json">Shot manifest</a> · <a href="reference-board.svg">Storyboard</a></p><script>let f=0,playing=true,last=0,acc=0;const image=document.getElementById("shot"),bar=document.getElementById("seek"),out=document.getElementById("caption");function draw(){image.src="keys/key-"+String(Math.floor(f/24)+1).padStart(2,"0")+".svg";bar.value=f;out.textContent="Frame "+f+" / 144 · key "+(Math.floor(f/24)+1)}function tick(t){if(playing&&last){acc+=Math.min(t-last,100);let advance=Math.floor(acc*24/1000);if(advance){f=(f+advance)%144;acc-=advance*1000/24}}last=t;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);document.getElementById("play").onclick=()=>{playing=!playing;document.getElementById("play").textContent=playing?"Pause":"Play"};bar.oninput=()=>{playing=false;f=Number(bar.value);draw()};</script></main></html>
