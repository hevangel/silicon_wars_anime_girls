<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>#83 paper stop-motion</title><style>body{margin:0;background:#171926;color:#f5f3f0;font:17px system-ui}main{max-width:1100px;margin:auto;padding:24px}img{width:100%;border:2px solid #d9be91;border-radius:10px}input{width:68%}button{padding:11px;background:#704d41;color:white;border:1px solid #ffe8b7}a{color:#e7ce9c}</style><main><h1>Paper-cutout stop-motion · digital simulation</h1><p>Eight individually authored SVG exposures, deliberately stepped at 8 unique poses per second within a 24fps timeline. No real camera capture is claimed.</p><img id="frame" src="frames/pose-00.svg" alt="Puppet frame 1"><div><button id="play">Pause</button><input id="scrub" type="range" min="0" max="191" value="0"><output id="counter">0/192</output></div><p><a href="printable-puppets.svg">Printable source patterns</a> · <a href="frame-exposure.csv">Exposure chart</a> · <a href="reference-board.svg">Review board</a></p><script>"use strict";let frame=0,last=0,acc=0,playing=true;const img=document.getElementById("frame"),bar=document.getElementById("scrub"),out=document.getElementById("counter");function draw(){const pose=Math.floor(frame/3)%8;img.src="frames/pose-"+String(pose).padStart(2,"0")+".svg";bar.value=frame;out.textContent="frame "+frame+" /192 · unique pose "+pose+" · 8fps stepped"}function tick(t){if(last&&playing){acc+=Math.min(100,t-last);let d=Math.floor(acc*24/1000);if(d){frame=(frame+d)%192;acc-=d*1000/24}}last=t;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);bar.oninput=()=>{playing=false;frame=Number(bar.value);draw()};document.getElementById("play").onclick=()=>{playing=!playing;document.getElementById("play").textContent=playing?"Pause":"Play"};</script></main></html>
