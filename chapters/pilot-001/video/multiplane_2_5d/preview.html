<!doctype html><html lang="en"><meta charset="utf-8"><title>Multiplane #76</title><style>body{background:#0b1629;color:#ecf5ff;font:16px system-ui}main{max-width:1200px;margin:auto;padding:20px}#stage{aspect-ratio:16/9;position:relative;overflow:hidden;border:1px solid #7084b4;background:#1b3359}#stage img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}input{width:90%}a{color:#a9d7ff}</style><main><h1>2.5D camera on three independent vector planes</h1><p>Pan the bounded camera. Three independently drawn art plates move at 0.22 / 0.58 / 1.00 depth. Not flattened-image zoom or painted Pilot art.</p><div id="stage"><img id="far" src="planes/far.svg" alt="distant citadel"><img id="mid" src="planes/mid.svg" alt="middle archways"><img id="near" src="planes/near.svg" alt="near characters"></div><label>Camera X <input id="camera" type="range" min="-100" max="100" value="0"></label><output id="value">0</output><p><a href="depth.json">Depth-plate manifest</a> · <a href="reference-board.svg">Review board</a></p><script>const range=document.getElementById("camera");function apply(){const x=Number(range.value);[["far",.22],["mid",.58],["near",1]].forEach(([id,d])=>{document.getElementById(id).style.transform="translateX("+(-x*d)+"px) scale(1.13)"});document.getElementById("value").textContent="camera: "+x+"px / offsets "+[-.22,-.58,-1].map(v=>Math.round(x*v)+"px").join(", ")}range.oninput=apply;apply()</script></main></html>
