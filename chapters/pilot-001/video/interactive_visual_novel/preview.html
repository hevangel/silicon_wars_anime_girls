<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Silicon Wars — Branching Novel</title><style>body{margin:0;background:#0c142b;color:#ecf5ff;font:17px system-ui}main{max-width:1100px;padding:23px;margin:auto}h1{margin:0 0 10px}#stage{background:linear-gradient(#15294e,#35345b);min-height:520px;border:1px solid #7e99b9;border-radius:15px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-around}#stage img{max-height:415px;max-width:43%;object-fit:contain;align-self:center;filter:drop-shadow(0 8px 18px #051020)}#dialogue{position:absolute;bottom:0;left:0;right:0;background:#08152eec;min-height:120px;border-top:2px solid #e2c589;padding:19px 27px}#speaker{font-size:22px;font-weight:bold;color:#ecd08d}#text{margin:5px 0 0;font-size:22px}#choices{display:flex;gap:10px;flex-wrap:wrap;padding:15px}button{background:#214a78;color:white;border:1px solid #91cfff;border-radius:7px;padding:12px;cursor:pointer}a{color:#abdefd}#status{color:#adbcd8}</style><main><h1>Silicon Wars · The Compatibility Choice</h1><p>Playable branching story using existing Intel and AMD reference cards. Two choices, two distinct endings, save/load without a server account.</p><div id="stage"><img id="intel" src="../../../../characters/intel/reference_card.jpg" alt="Intel Blue Empress"><img id="amd" src="../../../../characters/amd/reference_card.jpg" alt="AMD Crimson Challenger"><div id="dialogue"><div id="speaker"></div><p id="text"></p></div></div><div id="choices"></div><div><button id="save">Save locally</button><button id="load">Resume saved</button><button id="restart">Restart</button></div><p id="status"></p><p><a href="story.json">Editable story graph</a> · <a href="reference-board.svg">Visual choice board</a> · <a href="renpy/game/script.rpy">Ren'Py text source</a></p><script>"use strict";const KEY="silicon-wars-vn-001",el=id=>document.getElementById(id);let story,node;function draw(){const v=story.nodes[node];if(!v){el("text").textContent="Invalid node";return}el("speaker").textContent=v.speaker||"Narrator";el("text").textContent=v.text;el("intel").style.opacity=v.speaker==="AMD"?.5:1;el("amd").style.opacity=v.speaker==="Intel"?.5:1;const b=el("choices");b.replaceChildren();if(v.choices){v.choices.forEach(option=>{let btn=document.createElement("button");btn.textContent=option.label;btn.onclick=()=>go(option.to);b.append(btn)})}else if(v.next){let btn=document.createElement("button");btn.textContent="Continue";btn.onclick=()=>go(v.next);b.append(btn)}else{let btn=document.createElement("button");btn.textContent="Play again";btn.onclick=()=>go(story.start);b.append(btn)}el("status").textContent=(v.end?"ENDING: "+v.end:"Story node: "+node)+" · review status: script draft"}function go(n){if(!story.nodes[n])throw Error("Broken graph: "+n);node=n;draw()}el("save").onclick=()=>{localStorage.setItem(KEY,JSON.stringify({version:1,node}));el("status").textContent="Saved in this browser only at "+node};el("load").onclick=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(!saved||saved.version!==1||!story.nodes[saved.node])throw Error("No valid saved scene");go(saved.node)}catch(e){el("status").textContent=e.message}};el("restart").onclick=()=>go(story.start);fetch("story.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{story=d;go(story.start)}).catch(e=>el("status").textContent="Serve from repo root with python -m http.server: "+e.message);</script></main></html>
