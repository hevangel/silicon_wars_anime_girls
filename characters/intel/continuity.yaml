id: intel
title: The Blue Empress
identity: Long light-blue hair, sapphire eyes, unbranded sapphire crown, royal-blue and cream military coat, gold epaulettes, white gloves, and a wafer heirloom. The embroidered Intel Inside emblem sits above the hem of her left front skirt panel.
logo_lockup: wordmark
reference_assets:
  model_sheet: characters/intel/character_sheet.png
  expressions: characters/intel/expressions.png
  chibi_sheet: characters/intel/chibi_sheet.png
  portrait: characters/intel/reference_card.jpg

default_style: default_manga
supported_styles:
  - default_manga
  - chibi
  - live_action_hyperreal_fantasy
  - live_action_cosplay
  - live_action_cinematic
  - pixel_arcade_sf2
  - pixel_8bit_nes

style_variants:
  chibi:
    description: "Super-deformed cute comedic version of the character."
    silhouette: "large rounded head, tiny regal body"
    preserve:
      - long light-blue hair
      - sapphire eyes
      - royal-blue and silver/cream military color palette
      - unbranded sapphire crown
      - wafer heirloom motif
      - composed or smug expression
    simplifications:
      - simplify coat trim
      - reduce epaulette complexity
      - keep only one or two circuitry accents
      - keep the Intel Inside skirt embroidery as a single small emblem
    comedic_traits:
      - puffs up proudly
      - tiny disapproving stare
      - flustered royal indignation
    transform:
      proportions: "Target 2.5 anatomical heads tall from crown to soles"
      anatomy: "simplified"
      expressions: "more exaggerated"
      shading: "minimal"
      costume_detail: "simplified but recognizable"

  pixel_arcade_sf2:
    description: "Regal light-blue-haired arcade character distinct from AMD."
    override_file: characters/intel/styles/pixel_arcade_sf2.yaml
    preserve:
      - very long light-blue hair
      - sapphire-blue eyes and unbranded pointed sapphire crown
      - royal-blue and cream military costume
      - gold epaulettes, white gloves and wafer heirloom
      - small Intel Inside skirt-hem embroidery
    transform:
      proportions: "adult upright imperial fighter stance"
      rendering: "clean royal-blue fabric ramps; restrained gold sparkle"

  pixel_8bit_nes:
    description: "Regal blue silhouette with sapphire crown, cream coat and wafer."
    override_file: characters/intel/styles/pixel_8bit_nes.yaml
    preserve:
      - long light-blue hair
      - pointed unbranded sapphire crown
      - royal-blue and cream coat silhouette with epaulettes
      - wafer heirloom and tiny hem logo motif when legible
    transform:
      proportions: "adult upright stance in simplified pixel shapes"
      shading: "3 visible colors plus transparency per tile palette"

  live_action_cinematic:
    description: "An original fictional adult performer cast as Intel, without an actual company executive likeness."
    override_file: characters/intel/styles/live_action_cinematic.yaml
    preserve:
      - long light-blue hair and sapphire-blue eyes
      - pointed sapphire crown with no text
      - royal blue cream military coat, gold epaulettes and white gloves
      - wafer heirloom and small skirt-hem Intel Inside mark
    transform:
      realism: "human adult face, natural eyes; costume weight and seams make physical sense"
      camera: "consistent face geometry across casting, wardrobe and dialogue angles"

  live_action_cosplay:
    description: "Physically wearable Intel imperial convention costume."
    override_file: characters/intel/styles/live_action_cosplay.yaml
    preserve:
      - long ice-blue hair and sapphire crown
      - royal-blue and cream military coat, gold epaulettes
      - wafer heirloom and left-hem logo
    transform:
      materials: "twill, lining, sewn cords and lightweight crown support"
      emphasis: "supported epaulette/crown, full-length movement and closure detail"

  live_action_hyperreal_fantasy:
    description: "Same fictional Intel cast as cinematic style; extend power in sapphire Citadel projections."
    override_file: characters/intel/styles/live_action_hyperreal_fantasy.yaml
    preserve:
      - Intel cinematic actor face and mature regal anatomy
      - long light-blue hair, sapphire crown, blue-cream coat and wafer
      - small Intel Inside skirt emblem; never letter crown
    transform:
      effects: "sapphire x86 Citadel holographic architecture as separated VFX passes"
      lighting: "physically motivated blue illumination with visible grounding"
