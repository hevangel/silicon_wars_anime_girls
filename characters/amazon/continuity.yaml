id: amazon
title: The Logistics Overlord
identity: Dark brown hair in a practical low ponytail, amber-orange eyes, confident determined grin, black baseball cap with a white lowercase a and orange smile-arrow logo, dangling earrings, black-and-orange warehouse work jacket with orange smile-arrow logos over a dark top, logistics utility belt with pouches, dark work trousers, black fingerless work gloves, sturdy dark work boots. Signature props - cardboard delivery box with the black smile-arrow logo, and one small black quadcopter delivery drone familiar with glowing blue eyes.
