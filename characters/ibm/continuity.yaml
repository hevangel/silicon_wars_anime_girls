id: ibm
title: The Iron Lady of Computing
identity: Distinguished woman around sixty with steel-blue eyes, a silver-charcoal wavy bob, and thin gold-rimmed glasses. She wears a navy pinstripe power suit with peaked lapels, gently flared trousers, and a cobalt-and-white silk scarf.
reference_assets:
  model_sheet: characters/ibm/character_sheet.png
  expressions: characters/ibm/expressions.png
  chibi_sheet: characters/ibm/chibi_sheet.png
  portrait: characters/ibm/reference_card.jpg

default_style: default_manga
supported_styles: [default_manga, chibi]

style_variants:
  chibi:
    description: Super-deformed comedic version of the character.
    preserve:
      - silver-charcoal wavy bob and thin gold-rimmed glasses
      - navy pinstripe suit and cobalt-and-white scarf
      - upright posture and dry, composed expression
    transform:
      proportions: large head, tiny body
      anatomy: simplified
      expressions: more exaggerated
      shading: minimal
      costume_detail: simplified but recognizable
