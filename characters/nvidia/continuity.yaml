id: nvidia
title: The Emerald Queen
identity: Long green braid, goggles, strong arms, athletic legs, and black leather jacket-dress with green seams. Greatest raw physical strength of the cast.
logo_lockup: symbol_and_name
reference_assets:
  model_sheet: characters/nvidia/character_sheet.png
  expressions: characters/nvidia/expressions.png
  chibi_sheet: characters/nvidia/chibi_sheet.png
  portrait: characters/nvidia/reference_card.jpg

default_style: default_manga
supported_styles:
  - default_manga
  - chibi
  - loose_ink_fashion
  - polished_anime_key_art

style_variants:
  chibi:
    description: "Super-deformed cute comedic version of the character."
    silhouette: "large head, tiny but visibly muscular body"
    preserve:
      - long green braid
      - goggles
      - black leather jacket-dress with green seams
      - strongest-of-the-cast energy
    simplifications:
      - simplify jacket seams and buckles
      - keep one green accent stripe
    comedic_traits:
      - one-handed lifting of absurdly heavy objects
      - deadpan show-off
    transform:
      proportions: "Target 2.5 anatomical heads tall from crown to soles"
      anatomy: "simplified"
      expressions: "more exaggerated"
      shading: "minimal"
      costume_detail: "simplified but recognizable"

  loose_ink_fashion:
    description: "Expressive editorial ink and watercolor rendering of the canonical character."
    preserve:
      - long green braid and goggles
      - strong arms and athletic legs
      - black leather jacket-dress with green seams
      - powerful, confident silhouette and strongest-of-cast physique
    simplifications:
      - reduce incidental seam and fabric detail to gestural ink marks
      - retain signature accessories as readable silhouettes
      - use selective washes rather than replacing canonical colors

  polished_anime_key_art:
    description: "Fully rendered commercial anime key art; contrast to loose_ink_fashion."
    preserve:
      - long green braid and goggles
      - strong arms and athletic legs
      - black leather jacket-dress with green seams
      - powerful, confident silhouette and strongest-of-cast physique
    simplifications:
      - retain all identity-critical detail; simplify only distracting background elements
      - do not add generic mascot accessories or change the canonical outfit
