id: amd
title: The Crimson Challenger
identity: Red braided high ponytail, amber eyes, black-and-crimson tactical jacket, headphones at neck, fingerless gloves, and modular chiplets.
logo_lockup: wordmark
reference_assets:
  model_sheet: characters/amd/character_sheet.png
  expressions: characters/amd/expressions.png
  chibi_sheet: characters/amd/chibi_sheet.png
  portrait: characters/amd/reference_card.jpg

default_style: default_manga
supported_styles:
  - default_manga
  - chibi
  - live_action_hyperreal_fantasy
  - live_action_cosplay
  - live_action_cinematic
  - pixel_arcade_sf2
  - pixel_8bit_nes

style_variants:
  chibi:
    description: "Super-deformed cute comedic version of the character."
    silhouette: "spiky energetic shape with high ponytail"
    preserve:
      - red braided high ponytail
      - amber eyes
      - black-and-crimson color palette
      - chiplet armor motif
      - headphones at neck
      - energetic grin
    simplifications:
      - reduce armor segmentation
      - simplify boots
      - keep one strong chiplet emblem
    comedic_traits:
      - bouncy confidence
      - smug grin
      - over-the-top victory pose
    transform:
      proportions: "Target 2.5 anatomical heads tall from crown to soles"
      anatomy: "simplified"
      expressions: "more exaggerated"
      shading: "minimal"
      costume_detail: "simplified but recognizable"

  pixel_arcade_sf2:
    description: "High-energy red-haired pixel-fighter, not a recolored Intel."
    override_file: characters/amd/styles/pixel_arcade_sf2.yaml
    preserve:
      - red braided high ponytail with directional silhouette
      - amber eyes and animated grin
      - black-crimson segmented chiplet jacket
      - headphones resting at neck
      - modular chiplet motif and fingerless gloves
    transform:
      proportions: "adult fighter, no chibi foreshortening"
      rendering: "intentional hard clusters and sharp light-side accent"

  pixel_8bit_nes:
    description: "Red braided ponytail and chiplet silhouette in a tiny original 8-bit interpretation."
    override_file: characters/amd/styles/pixel_8bit_nes.yaml
    preserve:
      - red high braided ponytail represented by rearward pixel cluster
      - amber-eye intention where face tile budget allows
      - black and crimson tactical shape
      - headphones at neck and chiplet badge
    transform:
      proportions: "adult simplified pixel silhouette, not chibi"
      shading: "3 visible colors plus transparency per tile palette"

  live_action_cinematic:
    description: "An original fictional adult performer cast as AMD; stable face independent of pose and light."
    override_file: characters/amd/styles/live_action_cinematic.yaml
    preserve:
      - red braided high ponytail and amber-colored eye contact lenses
      - black crimson segmented tactical jacket and headphone collar
      - modular chiplet geometry, fingerless gloves and heavy boots
      - confident athletic adult pose and recognizable profile
    transform:
      realism: "natural human anatomy, skin and physically supported costume"
      camera: "50-85mm portrait casting then wider environmental two-shots"

  live_action_cosplay:
    description: "Physically wearable AMD fighter convention costume."
    override_file: characters/amd/styles/live_action_cosplay.yaml
    preserve:
      - braided red high ponytail and amber eye impression
      - black crimson jacket and headphone collar
      - modular chiplet motifs, fingerless gloves and practical boots
    transform:
      materials: "fabric, EVA foam and securely fitted thermoplastic trim"
      emphasis: "accessible sewing patterns, wearable moving shoulders and safe props"

  live_action_hyperreal_fantasy:
    description: "Same original AMD fictional performer as cinematic style; more dramatic Chiplet Barrage."
    override_file: characters/amd/styles/live_action_hyperreal_fantasy.yaml
    preserve:
      - AMD cinematic actor face and athletic mature human proportions
      - red high braid, amber eyes, headphones and black-crimson chiplet armor
      - independent visible silhouette beneath effects
    transform:
      effects: "crimson chiplets, sparks and articulated circuitry as separate layered VFX"
      lighting: "red effects cast controlled plausible color onto physical surfaces"
