id: amd
title: The Crimson Challenger
identity: Red braided high ponytail, amber eyes, black-and-crimson tactical jacket, headphones at neck, fingerless gloves, and modular chiplets.
logo_lockup: wordmark
reference_assets:
  model_sheet: characters/amd/character_sheet.png
  expressions: characters/amd/expressions.png
  chibi_sheet: characters/amd/chibi_sheet.png
  portrait: characters/amd/reference_card.jpg

default_style: default_manga
supported_styles:
  - default_manga
  - chibi
  - loose_ink_fashion
  - polished_anime_key_art

style_variants:
  chibi:
    description: "Super-deformed cute comedic version of the character."
    silhouette: "spiky energetic shape with high ponytail"
    preserve:
      - red braided high ponytail
      - amber eyes
      - black-and-crimson color palette
      - chiplet armor motif
      - headphones at neck
      - energetic grin
    simplifications:
      - reduce armor segmentation
      - simplify boots
      - keep one strong chiplet emblem
    comedic_traits:
      - bouncy confidence
      - smug grin
      - over-the-top victory pose
    transform:
      proportions: "Target 2.5 anatomical heads tall from crown to soles"
      anatomy: "simplified"
      expressions: "more exaggerated"
      shading: "minimal"
      costume_detail: "simplified but recognizable"

  loose_ink_fashion:
    description: "Expressive editorial ink and watercolor rendering of the canonical character."
    preserve:
      - red braided high ponytail and amber eyes
      - black-and-crimson tactical jacket
      - headphones at neck and fingerless gloves
      - modular chiplets and energetic challenger silhouette
    simplifications:
      - reduce incidental seam and fabric detail to gestural ink marks
      - retain signature accessories as readable silhouettes
      - use selective washes rather than replacing canonical colors

  polished_anime_key_art:
    description: "Fully rendered commercial anime key art; contrast to loose_ink_fashion."
    preserve:
      - red braided high ponytail and amber eyes
      - black-and-crimson tactical jacket
      - headphones at neck and fingerless gloves
      - modular chiplets and energetic challenger silhouette
    simplifications:
      - retain all identity-critical detail; simplify only distracting background elements
      - do not add generic mascot accessories or change the canonical outfit
