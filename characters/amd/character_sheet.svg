 <text x="870" y="225" fill="#d72f4b" font-size="17" font-weight="800" letter-spacing="2">APPEARANCE</text><text x="870" y="254" fill="#e4e8f6" font-size="17">Athletic red-haired heroine, high ponytail, amber eyes and irrepressible</text><text x="870" y="278" fill="#e4e8f6" font-size="17">grin</text><text x="870" y="330" fill="#d72f4b" font-size="17" font-weight="800" letter-spacing="2">CLOTHING</text><text x="870" y="359" fill="#e4e8f6" font-size="17">Black-and-red cropped tactical jacket, modular chiplet plating and heavy</text><text x="870" y="383" fill="#e4e8f6" font-size="17">boots</text><text x="870" y="435" fill="#d72f4b" font-size="17" font-weight="800" letter-spacing="2">PERSONALITY</text><text x="870" y="464" fill="#e4e8f6" font-size="17">Tenacious, scrappy, witty, determined to be taken seriously</text><text x="870" y="540" fill="#d72f4b" font-size="17" font-weight="800" letter-spacing="2">VOICE</text><text x="870" y="569" fill="#e4e8f6" font-size="17">Fast sarcastic challenges and friendly taunts toward Intel</text><text x="870" y="645" fill="#d72f4b" font-size="17" font-weight="800" letter-spacing="2">FLAW</text><text x="870" y="674" fill="#e4e8f6" font-size="17">Can overcommit while proving her worth</text>
 <text x="56" y="799" font-size="16" fill="#d6e7f9">COLOR STUDY</text>
