  - Preserve the hoodie and clearly visible cape in all full-body views.
  - Both legs have horizontal purple and dark striped stockings from shorts hem to boots.
  - Do not show exposed thighs or replace stockings with bare skin.
  - Keep the palette blue, violet, lilac, charcoal and cyan.
  - Expression portraits must preserve the same face, hair and VR headset.
