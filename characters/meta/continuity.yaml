id: meta
title: The Social Worldbuilder
age: 20
palette: [electric-blue, violet, lilac, charcoal, cyan]
identity: >-
  Young adult woman with violet-blue eyes, a tousled blue-violet side bun and
  electric-blue face-framing strands. Angular black and white VR visor pushed
  above her eyes, with a glowing cyan Meta infinity-loop emblem.
costume: >-
  Oversized black cyberpunk hoodie with electric-blue seams, a flowing asymmetrical
