id: meta
title: The Social Worldbuilder
age: 20
palette: [electric-blue, violet, lilac, charcoal, cyan]
identity: >-
  Young adult woman with violet-blue eyes, a tousled blue-violet side bun and
  electric-blue face-framing strands. Angular black and white VR visor pushed
  above her eyes, with a glowing cyan Meta infinity-loop emblem.
costume: >-
  Oversized black cyberpunk hoodie with electric-blue seams, a flowing asymmetrical
  purple and lilac holographic cape with geometric wireframe lining, fitted dark
  shorts, fully opaque horizontal black-and-purple striped stockings covering
  both legs without exposed thighs, utility belt and black technical boots.
continuity_rules:
  - Keep the blue-violet hair identity, side bun, violet eyes and cyan infinity visor.
  - Preserve the hoodie and clearly visible cape in all full-body views.
  - Both legs have horizontal purple and dark striped stockings from shorts hem to boots.
  - Do not show exposed thighs or replace stockings with bare skin.
  - Keep the palette blue, violet, lilac, charcoal and cyan.
  - Expression portraits must preserve the same face, hair and VR headset.
reference_assets:
  model_sheet: characters/meta/character_sheet.png
  expressions: characters/meta/expressions.png
  portrait: characters/meta/reference_card.jpg

default_style: default_manga
supported_styles:
  - default_manga
  - chibi

style_variants:
  chibi:
    description: "Super-deformed cute comedic version of the character."
    silhouette: "large head, tiny body under an oversized hoodie and cape"
    preserve:
      - tousled blue-violet side bun with electric-blue strands
      - violet-blue eyes
      - VR visor with glowing cyan infinity-loop emblem
      - black hoodie with electric-blue seams
      - purple-lilac cape
      - black-and-purple striped stockings
    simplifications:
      - simplify the cape's wireframe lining to a few geometric lines
      - keep the visor as one angular band with the cyan loop
    comedic_traits:
      - building tiny worlds with both hands
      - oblivious headset-on stare
    transform:
      proportions: "large head, tiny body"
      anatomy: "simplified"
      expressions: "more exaggerated"
      shading: "minimal"
      costume_detail: "simplified but recognizable"
