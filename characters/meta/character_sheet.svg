<text x="864" y="226" font-size="17" font-weight="bold" fill="#855dbe">APPEARANCE</text><text x="864" y="254" font-size="16" fill="#e3eafa">Blue-purple hair, energetic expression and augmented-reality glasses</text><text x="864" y="332" font-size="17" font-weight="bold" fill="#855dbe">CLOTHING</text><text x="864" y="360" font-size="16" fill="#e3eafa">Fashionable streetwear, VR visor and holographic avatar bracelets</text><text x="864" y="438" font-size="17" font-weight="bold" fill="#855dbe">PERSONALITY</text><text x="864" y="466" font-size="16" fill="#e3eafa">Outgoing, curious, ambitious and trend-sensitive</text><text x="864" y="544" font-size="17" font-weight="bold" fill="#855dbe">VOICE</text><text x="864" y="572" font-size="16" fill="#e3eafa">Casual, humorous and overly enthusiastic about sharing</text><text x="864" y="650" font-size="17" font-weight="bold" fill="#855dbe">FLAW</text><text x="864" y="678" font-size="16" fill="#e3eafa">Overreaches and creates controversy over privacy</text><text x="55" y="800" font-size="16" fill="#e2eaf8">PALETTE</text><rect x="155" y="769" width="68" height="30" fill="#855dbe" rx="4"/><rect x="235" y="769" width="68" height="30" fill="#855dbe" rx="4"/><rect x="315" y="769" width="68" height="30" fill="#f0cbbb" rx="4"/><rect x="395" y="769" width="68" height="30" fill="#111b30" rx="4"/><text x="514" y="792" font-size="15" fill="#dde8fa">Avatar Multiverse</text><text x="50" y="861" font-size="18" fill="#e8f1ff">Open the gates. Let everyone build.</text><text x="1547" y="862" text-anchor="end" font-size="13" fill="#9cb0ce">Editable draft • not final painted artwork</text></g></svg>