prompt: |
  Anime K-pop stage performance. Use the three supplied character sheets ONLY as identity references for faces, hair, costumes and colors — do not reproduce their sheet layout, cream background, view labels or any text from them.

  Three adult anime idol performers, exactly on-model:
  1) Intel — tall elegant woman, very long flowing light-blue wavy hair, small sapphire-crystal crown, sapphire-blue eyes, royal-blue imperial coat-dress with cream lining and gold trim, gold-fringed epaulettes, white gloves, thigh-high black boots; small round "Intel Inside" emblem near the hem of her left front skirt panel.
  2) AMD — athletic woman, fiery red braided high ponytail, amber eyes, off-shoulder crimson-and-black cropped tactical jacket over a black crop top, gold buckles, chunky black cargo trousers with red accents, black-and-red headphones around her neck, fingerless gloves, heavy boots.
  3) Nvidia — tall, broad-shouldered, powerful woman, thick long emerald-green braid, black goggles pushed up into her hair, piercing emerald eyes, black leather jacket-dress with glowing neon-green circuit seams and a wide belt, heavy boots.

  One continuous shot, 5 seconds: the trio stands center stage in a V, then on the beat they step forward together and hit a sharp synchronized arm line, hair flips, and a confident holding pose, each singing into a handheld microphone. Intel composed and regal, AMD grinning and cocky, Nvidia smug and commanding.

  Setting: enormous arena stage, giant LED wall glowing blue, crimson and emerald, laser beams, sweeping spotlights, drifting confetti, cyan stage smoke, glossy reflective floor, dark audience sea of glowing light sticks.

  Cinematic anime, crisp cel-shaded rendering, rim light and lens flare, camera arcs slowly around the trio while pushing in slightly.

  Constraints: exactly three performers, nobody else on stage; no on-screen text, captions or added logos beyond the costumes; no costume, hairstyle or hair-color changes; faces consistent and on-model; correct anatomy and hands.

