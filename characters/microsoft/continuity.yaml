id: microsoft
title: The Azure Commander
identity: "30-year-old woman. Light ash-blonde hair in a neat low bun with four-color windowpane hair clips, blue eyes, black-rimmed rectangular glasses (worn in every view), tailored dark charcoal knee-length sheath business dress under a fitted blazer with windowpane lapel pin and azure pocket square, blue corporate lanyard with ID name badge, black low-heel pumps. She wears a dress, never trousers (outfit changed 2026-11-07 at Horace's direction). Signature prop: white coffee mug with the four-color windowpane logo."
reference_assets:
  model_sheet: characters/microsoft/character_sheet.png
  expressions: characters/microsoft/expressions.png
  chibi_sheet: characters/microsoft/chibi_sheet.png
  portrait: characters/microsoft/reference_card.jpg

default_style: default_manga
supported_styles:
  - default_manga
  - chibi

style_variants:
  chibi:
    description: "Super-deformed cute comedic version of the character."
    silhouette: "large head, tiny executive body in a dress and blazer"
    preserve:
      - ash-blonde low bun with windowpane hair clips
      - black-rimmed glasses
      - charcoal business dress under the fitted blazer
      - blue lanyard with ID name badge
      - windowpane coffee mug
    simplifications:
      - simplify the windowpane pin and pocket square to simple color squares
      - keep the lanyard as one blue strap with a white badge rectangle
    comedic_traits:
      - quiet boardroom stare over the glasses
      - clipped tiny reprimand
      - rare launch-day excitement
    transform:
      proportions: "large head, tiny body"
      anatomy: "simplified"
      expressions: "more exaggerated"
      shading: "minimal"
      costume_detail: "simplified but recognizable"
