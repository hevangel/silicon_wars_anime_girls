id: xerox-parc
title: The Unpaid Inventor
identity: "Early-seventies slender woman with lightly stooped shoulders, softly lined elderly face, attentive blue-gray eyes, gently mischievous smile, and side-parted chin-length white bob with a few flyaways. Faded dusty-rose late-1960s collared A-line button-front shirt dress with cream pointed collar and same-fabric waist belt, hem just below knee, open oatmeal-gray worn cardigan with a brown patch on her right elbow (viewer left in front) and visible small darn by right pocket, tan stockings and dark-brown scuffed loafers. A tiny beige rectangular two-button vintage mouse pendant hangs from a thin cord in front only."
logo_lockup: wordmark
