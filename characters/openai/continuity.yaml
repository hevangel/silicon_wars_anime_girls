id: openai
title: The Reckless Prodigy
identity: "Elementary-school girl with a fluffy silver-white side ponytail, blue-teal eyes, and an oversized navy knot ribbon with glowing cyan edges. Wears a white-and-navy sailor uniform with a teal tie and carries an experiment backpack with a little white robot."
logo_lockup: symbol_and_name
reference_assets:
  model_sheet: characters/openai/character_sheet.png
  expressions: characters/openai/expressions.png
  chibi_sheet: characters/openai/chibi_sheet.png
  portrait: characters/openai/reference_card.jpg

default_style: default_manga
supported_styles: [default_manga, chibi]

style_variants:
  chibi:
    description: Super-deformed comedic version of the character.
    preserve:
      - elementary-school proportions, fluffy side ponytail, and navy knot ribbon
      - white-and-navy uniform, teal tie, and experiment backpack
      - idea wink, doodle notebook, and little white robot
    transform:
      proportions: large head, tiny body
      anatomy: simplified
      expressions: more exaggerated
      shading: minimal
      costume_detail: simplified but recognizable
