id: huawei
title: The Full-Stack Phoenix
identity: "Determined woman in her late twenties with long near-black hair streaked scarlet, an ornate high bun, red tassels, a pink flower, and a phoenix-feather pin. Black high-collar bodice with gold dragon embroidery, wide scarlet sleeves, white Huawei shoulder armor, layered skirt plates, black boots, and a tool belt with a gold-repaired tablet."
reference_assets:
  model_sheet: characters/huawei/character_sheet.png
  expressions: characters/huawei/expressions.png
  portrait: characters/huawei/reference_card.jpg

default_style: default_manga
supported_styles: [default_manga, chibi]

style_variants:
  chibi:
    description: Super-deformed comedic version of the character.
    preserve:
      - near-black hair with scarlet streaks, ornate bun, tassels, and phoenix-feather pin
      - gold dragon on black bodice, wide scarlet sleeves, and layered armored skirt
      - white Huawei shoulder emblem, tool belt, and planted stance
    transform:
      proportions: large head, tiny body
      anatomy: simplified
      expressions: more exaggerated
      shading: minimal
      costume_detail: simplified but recognizable
