id: marvell
title: The Deep-Sea Navigator
identity: >-
  A 20-year-old optical field engineer with amber eyes, fine wire-frame glasses,
  and a navy-black jaw-length asymmetrical bob. The shorter right side tucks
  behind her ear under a Marvell clip, and the longer left side carries a deep-teal
  streak. She wears a white rolled-sleeve, knee-length engineering coatdress with a
  storm collar, navy inset and side panels, copper piping, right sleeve emblem,
  teal harness, tool belt, and dark ankle engineering boots.
logo_lockup: symbol_and_name
reference_assets:
  model_sheet: characters/marvell/character_sheet.png
  expressions: characters/marvell/expressions.png
  chibi_sheet: characters/marvell/chibi_sheet.png
  portrait: characters/marvell/reference_card.jpg

default_style: default_manga
supported_styles: [default_manga, chibi]

style_variants:
  chibi:
    description: Super-deformed comedic version of the character.
    preserve:
      - jaw-length asymmetrical bob with a deep-teal streak and Marvell clip
      - amber eyes, fine wire-frame glasses, and teal-and-gold earrings
      - white knee-length coatdress, navy side panels, copper trim, teal harness, and work boots
    transform:
      proportions: 2.5 anatomical head heights
      anatomy: simplified
      expressions: more exaggerated
      shading: minimal
      costume_detail: simplified but recognizable
