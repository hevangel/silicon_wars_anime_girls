id: micron
title: The Stack-'Em-High Wrangler
identity: "Adult young woman in her mid 20s with honey-blonde hair in a long side braid, bright blue eyes, a cream cowboy hat with a silver iridescent band, a fringed cream vest with a chip-shaped sheriff star, an iridescent violet neckerchief, and a DIMM holstered at her hip."
reference_assets:
