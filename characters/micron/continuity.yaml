    preserve:
      - honey-blonde side braid and wide cream cowboy hat with iridescent band
      - fringed cream vest, chip-shaped sheriff star, iridescent violet neckerchief
      - holstered DIMM, connector belt buckle, glowing iridescent lasso
    transform:
      proportions: large head, tiny body
