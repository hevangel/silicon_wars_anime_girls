<text x="864" y="226" fill="#2aa3a9" font-size="17" font-weight="bold">APPEARANCE</text><text x="864" y="254" fill="#e3eafb" font-size="16">Steel-gray braid, blue-green eyes and experienced engineer posture</text><text x="864" y="332" fill="#2aa3a9" font-size="17" font-weight="bold">CLOTHING</text><text x="864" y="360" fill="#e3eafb" font-size="16">White-teal engineering uniform, Mentor heritage badge and Calibre tools</text><text x="864" y="438" fill="#2aa3a9" font-size="17" font-weight="bold">PERSONALITY</text><text x="864" y="466" fill="#e3eafb" font-size="16">Practical, disciplined, unflappable and dryly witty</text><text x="864" y="544" fill="#2aa3a9" font-size="17" font-weight="bold">VOICE</text><text x="864" y="572" fill="#e3eafb" font-size="16">Calm methodical checklists and understated critiques</text><text x="864" y="650" fill="#2aa3a9" font-size="17" font-weight="bold">FLAW</text><text x="864" y="678" fill="#e3eafb" font-size="16">Bureaucratic habits may resist unconventional ideas</text><text x="55" y="800" font-size="16" fill="#e2eaf8">PALETTE</text><rect x="155" y="769" width="68" height="30" fill="#a8b1bb" rx="4"/><rect x="235" y="769" width="68" height="30" fill="#2aa3a9" rx="4"/><rect x="315" y="769" width="68" height="30" fill="#f0cbbb" rx="4"/><rect x="395" y="769" width="68" height="30" fill="#111b30" rx="4"/><text x="514" y="792" font-size="15" fill="#dde8fa">Questa Mirror</text><text x="50" y="861" font-size="18" fill="#e8f1ff">The chip is correct. The package still overheats.</text><text x="1547" y="862" text-anchor="end" font-size="13" fill="#9cb0ce">Editable draft • not final painted artwork</text></g></svg>