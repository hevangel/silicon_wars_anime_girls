<text x="864" y="226" font-size="17" font-weight="bold" fill="#3da9d1">APPEARANCE</text><text x="864" y="254" font-size="16" fill="#e3eafa">Dark hair streaked with red, blue, green and yellow, curious sparkling eyes</text><text x="864" y="332" font-size="17" font-weight="bold" fill="#3da9d1">CLOTHING</text><text x="864" y="360" font-size="16" fill="#e3eafa">Research lab coat, colorful trinkets and four orbiting knowledge orbs</text><text x="864" y="438" font-size="17" font-weight="bold" fill="#3da9d1">PERSONALITY</text><text x="864" y="466" font-size="16" fill="#e3eafa">Brilliant, distracted, expansive and creative</text><text x="864" y="544" font-size="17" font-weight="bold" fill="#3da9d1">VOICE</text><text x="864" y="572" font-size="16" fill="#e3eafa">Frequently says Actually and remembers an older paper</text><text x="864" y="650" font-size="17" font-weight="bold" fill="#3da9d1">FLAW</text><text x="864" y="678" font-size="16" fill="#e3eafa">Too many unrelated ideas compete for attention</text><text x="55" y="800" font-size="16" fill="#e2eaf8">PALETTE</text><rect x="155" y="769" width="68" height="30" fill="#292a3f" rx="4"/><rect x="235" y="769" width="68" height="30" fill="#4194d2" rx="4"/><rect x="315" y="769" width="68" height="30" fill="#f0cbbb" rx="4"/><rect x="395" y="769" width="68" height="30" fill="#111b30" rx="4"/><text x="514" y="792" font-size="15" fill="#dde8fa">Rainbow Searchlight</text><text x="50" y="861" font-size="18" fill="#e8f1ff">We researched that twelve years ago! Let me find the paper.</text><text x="1547" y="862" text-anchor="end" font-size="13" fill="#9cb0ce">Editable draft • not final painted artwork</text></g></svg>