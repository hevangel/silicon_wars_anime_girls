id: anthropic
title: The Precautionary Prodigy
identity: Elementary-school class monitor about 9–10 with dark-brown springy ringlets, warm-brown eyes, a terracotta hard hat with a Claude spark badge, an orange safety sash, and a clipboard held close.
logo_lockup: symbol_and_name
reference_assets:
  model_sheet: characters/anthropic/character_sheet.png
  expressions: characters/anthropic/expressions.png
  chibi_sheet: characters/anthropic/chibi_sheet.png
  portrait: characters/anthropic/reference_card.jpg

default_style: default_manga
supported_styles: [default_manga, chibi]

style_variants:
  chibi:
    description: Super-deformed comedic version of the character.
    preserve:
      - dark-brown ringlets and terracotta hard hat with cream stripe, Claude spark badge, and clipped chin strap
      - cream blouse, charcoal pinafore, orange safety sash, armband, and knee pads
      - guarded stance, clipboard, and leather checklist satchel
    transform:
      proportions: large head, tiny body
      anatomy: simplified
      expressions: more exaggerated
      shading: minimal
      costume_detail: simplified but recognizable
