id: tsmc
title: The Quiet Queenmaker
identity: "Poised woman in her late twenties with an ash-silver bob, amber eyes, thin round silver glasses, and a wafer-die hairpin with a wine-red tassel. Pearl-white die-grid cleanroom tunic and skirt, narrow wine-red trim and sash, silver belt, gloves, lowered mask, loupe, and pearl ankle boots."
reference_assets:
  model_sheet: characters/tsmc/character_sheet.png
  expressions: characters/tsmc/expressions.png
  chibi_sheet: characters/tsmc/chibi_sheet.png
  portrait: characters/tsmc/reference_card.jpg

default_style: default_manga
supported_styles: [default_manga, chibi]

style_variants:
  chibi:
    description: Super-deformed comedic version of the character.
    preserve:
      - ash-silver bob and wafer-die pin with wine-red tassel
      - round silver glasses, lowered mask, and loupe
      - pearl die-grid outfit with narrow wine-red accents and calm inspection posture
    transform:
      proportions: large head, tiny body
      anatomy: simplified
      expressions: more exaggerated
      shading: minimal
      costume_detail: simplified but recognizable
