    <text x="17" y="31" fill="#96d2ff" font-size="15">03</text>
    <text x="55" y="33" fill="#f2f6fc" font-size="23" font-weight="700">Storyboard</text>
    <text x="55" y="66" fill="#bfcee2" font-size="17">Page beats and camera</text>
  </g>
    <g transform="translate(24 193)">
