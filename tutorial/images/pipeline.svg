<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 996 318" width="996" height="318" role="img" aria-labelledby="title">
  <title id="title">Six stages of manga production</title>
  <rect width="996" height="318" rx="16" fill="#0c1526"/>
  <g font-family="system-ui, sans-serif">
    <text x="24" y="46" fill="#f2f6fc" font-size="27" font-weight="700">Each stage produces a reviewable artifact</text>
    <g transform="translate(24 75)">
