<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 260" width="908" height="260" role="img" aria-labelledby="title">
  <title id="title">Panel compositing from background, character, and lettering</title>
  <rect width="908" height="260" rx="16" fill="#0c1526"/>
  <g font-family="system-ui, sans-serif">
