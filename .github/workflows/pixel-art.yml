name: Pixel-art tooling checks

on:
  push:
    branches:
      - issue/60-pixel-arcade-style
      - issue/61-nes-pixel-style
  pull_request:
    paths:
      - "bible/*.yaml"
      - "characters/*/continuity.yaml"
      - "characters/*/styles/pixel_*.yaml"
      - "tools/*pixel*.py"
      - ".github/workflows/pixel-art.yml"

jobs:
  pixel-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Pillow>=10.1" "PyYAML>=6.0"
      - name: Validate style YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path("bible").glob("*.yaml"))
          files += [p for p in sorted(Path("characters").glob("*/continuity.yaml")) if p.parent.name != "_template"]
          files += sorted(Path("characters").glob("*/styles/pixel_*.yaml"))
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          print("Validated", len(files), "YAML files")
          PY
      - run: python -m unittest discover -s tools -p "test_pixel_arcade.py" -v
      - run: python -m unittest discover -s tools -p "test_nes_sprite.py" -v
      - run: python -m unittest discover -s tools -p "test_style_registry.py" -v
      - run: python -m unittest discover -s tools -p "test_compose_fantasy_fx.py" -v
      - run: python -m unittest discover -s tools -p "test_toon_profile.py" -v
