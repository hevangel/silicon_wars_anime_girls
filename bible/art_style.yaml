# Silicon Wars global art style system.
#
# A style variant is a rendering mode, NOT a different character. Identity is
# immutable and lives in each character's continuity.yaml (name, persona, hair
# color and signature hairstyle, eye color, signature colors, core outfit
# motifs, personality, signature prop / power, speaking style). Only the
# rendering rules in this file change between variants.
#
# Levels:
#   1. This file        — what each variant means for the whole project.
#   2. continuity.yaml  — per-character style_variants: what to preserve and
#                         what to simplify for that character in each variant.
#   3. Panel YAML       — a panel's `style_variant` field picks the variant
#                         for that panel (default: default_manga).
#
# Where each variant may appear is governed by style_usage_policy.yaml.

style_system:
  default_style: default_manga

  variants:
    default_manga:
      description: "Primary Silicon Wars story style."
      proportions:
        head_to_body_ratio: "1:6.5 to 1:7"
        limbs: "natural anime proportions"
        hands_feet: "fully drawn"
      rendering:
        line_style: "clean manga line art"
        shading: "cel shading or manga screentone"
        detail_level: "high"
      expression_rules:
        exaggeration: "moderate"
      pose_rules:
        style: "heroic, dramatic, story-driven"
      tone: "dramatic, stylish, semi-serious"

    chibi:
      description: "Super-deformed comedic style for reaction shots, comedy cutaways, and bonus scenes."
      proportions:
        head_to_body_ratio: "1:2.5"
        measurement: "Crown to chin is 40% of standing height from crown to soles. Ignore hair and headwear above the crown."
        limbs: "short and simplified"
        hands_feet: "small, rounded, and simplified"
      rendering:
        line_style: "clean, rounded, cute"
        shading: "minimal"
        detail_level: "medium"
      expression_rules:
        exaggeration: "high"
        mouth_shapes: "simple and very expressive"
        eye_style: "large and simplified"
      pose_rules:
        style: "cute, comedic, exaggerated"
      tone: "cute, comedic, high-energy"
      rules:
        - preserve character identity through hair, colors, and signature accessories
        - simplify costume details but keep major motifs
        - use exaggerated expressions
        - avoid realistic anatomy

    pixel_arcade_sf2:
      description: "Original 1990s 16-bit-era arcade fighter-inspired native pixel art; NOT an 8-bit/NES palette or existing game IP."
      proportions:
        head_to_body_ratio: "1:5.5 to 1:6.5 within intentional 96x128 or 128x160 pixel staging"
        limbs: "readable active combat silhouette; hands deliberately clustered"
        hands_feet: "4-8 pixel feature clusters, no blurred contours"
      rendering:
        canvas_px: [[96, 128], [128, 160]]
        pixel_scale: "1x native output; 4x integer preview by nearest-neighbour only"
        palette_size: {min: 16, max: 32}
        outlines: "1 to 2 native pixels; selective colored outline in bright-facing zones"
        shading: "hard material-specific 3-5 color ramps; no blended gradients"
        antialiasing: false
        alpha_levels: [0, 255]
        light_direction: "upper left, fixed within a sprite set"
        anatomy_rule: "draw clusters intentionally at target pixel resolution, never scale a manga image and call it master"
      expression_rules:
        exaggeration: "high readability at native size, facial features remain identity-locked"
      pose_rules:
        style: "strong left/right silhouette and planted feet; explicit foot anchor; no reused pose across characters"
      production:
        reference_sheet: "front, three-quarter, side, back, face close-up, palette and one attack stance"
        animation_sheet: "uniform cells with frame IDs, anchors, hitboxes and optional separated limbs"
        frame_method: "hand-draw the master and correct pixels before building derived frames"
        acceptance: "manual art-director approval required; numeric validators alone are insufficient"

    pixel_8bit_nes:
      description: "Intentionally minimal early-console sprite design inspired by 8-bit home consoles; not arcade pixel art."
      proportions:
        head_to_body_ratio: "abstracted adult silhouette; a few large legible shape clusters"
        limbs: "compressed, articulated at tile-scale"
      rendering:
        native_canvas_px: [[32, 48], [48, 64]]
        stage_px: [256, 240]
        tile_px: [8, 8]
        opaque_colors_per_sprite_palette: 3
        transparency: "one transparent index, alpha 0 or 255"
        upscale: "integer-only nearest neighbour"
        outline: "single-pixel dark cluster when available within palette budget"
        shading: "flat clusters and high-contrast color blocking; no soft AA"
      expression_rules:
        exaggeration: "eyes and mouth as purposeful small tile changes"
      pose_rules:
        style: "idle/walk cycle, simple silhouette, unmistakable signature prop"
      production:
        mode: "creative_budget by default; hardware_candidate requires NES emulator checks"
        reference_sheet: "front, side, back, 4-frame walk/idle, face/eye/mouth tiles and palette allocation"
        tile_budget: "8x8 tiles; each tile assigned one 3-color plus transparent sprite palette"
        hardware_authenticity: "Never claim hardware-accurate without PPU/OAM emulation, scanline and sprite overlap review"
        approval: "Explicit visual review required, distinct from palette validation"

    live_action_cinematic:
      description: "Film-quality live-action reinterpretation with original fictional adult performers, separate from real-person likeness."
      actor:
        identity_lock: "face structure, asymmetry, skin texture, hairline, physique and complexion across takes"
        real_person_likeness: "no celebrity, actual executive or identifiable real-person impersonation"
        casting_reference: "neutral front, three-quarter and profile head portraits under controlled flat light"
      wardrobe:
        constraint: "physically constructible seams, fasteners, fabrics, armor, support and prop dimensions"
        versioning: "actor_id independent of wardrobe_id, expression, shot and light rig"
      rendering:
        style: "photographic film still, plausible lens and camera height"
        light: "key/fill/rim with contact and bounced light"
        skin: "retain pores, natural asymmetry, physically plausible speculars; no face smoothing"
        effects: "restrained integrated science fiction, no detached flying costume pieces"
      reference_sheets: [casting_face, wardrobe_turnaround, expressions_acting, props_materials]
      approval:
        separate_gates: [casting_identity, wardrobe_physics, lighting_consistency, likeness_disclosure]
        visual_human_review: required

    live_action_cosplay:
      description: "Real-world buildable costume and studio photography; distinct from cinematic VFX and photoreal fantasy."
      materials: [fabric, foam, thermoplastic, 3d_printed_prop, lightweight_metal_trim]
      tiers:
        maker: "accessible construction using sourced safe materials; no fabricated prices"
        showpiece: "tailored convention-grade interpretation with advanced finishing"
      wardrobe:
        requirement: "seam and pattern callouts, closures, wig setup, makeup, safe props, material labels and weight"
        logo: "historically appropriate removable badge or garment appliqué"
      photography:
        stage: "neutral studio cyclorama, believable shadows and full-body editorial lens"
        effects: "restrained practical lighting; no impossible hovering armor"
      reference_sheets: [full_body_three_view, wig_makeup, materials_and_patterns, prop_safety]
      approval: "human costume feasibility and visual review required"

    live_action_hyperreal_fantasy:
      description: "Physically plausible photoreal actors and original exaggerated semiconductor magic on separately editable VFX plates."
      inherits_actor_identity: live_action_cinematic
      actor:
        constraint: "same original fictional adult performer and facial geometry regardless of effects"
      wardrobe:
        design: "heroic expanded but plausibly supported armor with separate simulated ornamentation"
        required_labels: [physical_material, simulated_vfx, contact_shadow]
      rendering:
        capture: "HDR-inspired film still; physically consistent key/fill/rim and eye lines"
        compositing: "actor and costume as independent base plates; chiplet/citadel/light effects as removable RGBA overlays"
        depth: "camera and perspective match on every plate"
        skin_rule: "effects cannot repaint or obscure enough face to break identity"
      effects:
        intel: "sapphire x86 Citadel geometry, visible source and matching ground bounce"
        amd: "crimson modular Chiplet Barrage with separate motion and glow"
        nvidia: "emerald dragon aura only if her own continuity is referenced in a later approved scope"
      reference_sheets: [inherited_casting, heroic_costume_turnaround, material_board, fx_atlas, key_art_camera_tests]
      approval: "human continuity, VFX masking and lighting review; no automatic approval"
