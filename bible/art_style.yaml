# Silicon Wars global art style system.
#
# A style variant is a rendering mode, NOT a different character. Identity is
# immutable and lives in each character's continuity.yaml (name, persona, hair
# color and signature hairstyle, eye color, signature colors, core outfit
# motifs, personality, signature prop / power, speaking style). Only the
# rendering rules in this file change between variants.
#
# Levels:
#   1. This file        — what each variant means for the whole project.
#   2. continuity.yaml  — per-character style_variants: what to preserve and
#                         what to simplify for that character in each variant.
#   3. Panel YAML       — a panel's `style_variant` field picks the variant
#                         for that panel (default: default_manga).
#
# Where each variant may appear is governed by style_usage_policy.yaml.

style_system:
  default_style: default_manga

  variants:
    default_manga:
      description: "Primary Silicon Wars story style."
      proportions:
        head_to_body_ratio: "1:6.5 to 1:7"
        limbs: "natural anime proportions"
        hands_feet: "fully drawn"
      rendering:
        line_style: "clean manga line art"
        shading: "cel shading or manga screentone"
        detail_level: "high"
      expression_rules:
        exaggeration: "moderate"
      pose_rules:
        style: "heroic, dramatic, story-driven"
      tone: "dramatic, stylish, semi-serious"

    chibi:
      description: "Super-deformed comedic style for reaction shots, comedy cutaways, and bonus scenes."
      proportions:
        head_to_body_ratio: "1:2.5"
        measurement: "Crown to chin is 40% of standing height from crown to soles. Ignore hair and headwear above the crown."
        limbs: "short and simplified"
        hands_feet: "small, rounded, and simplified"
      rendering:
        line_style: "clean, rounded, cute"
        shading: "minimal"
        detail_level: "medium"
      expression_rules:
        exaggeration: "high"
        mouth_shapes: "simple and very expressive"
        eye_style: "large and simplified"
      pose_rules:
        style: "cute, comedic, exaggerated"
      tone: "cute, comedic, high-energy"
      rules:
        - preserve character identity through hair, colors, and signature accessories
        - simplify costume details but keep major motifs
        - use exaggerated expressions
        - avoid realistic anatomy

    loose_ink_fashion:
      description: "Japanese editorial fashion illustration with gestural ink and selective watercolor-like washes."
      proportions:
        head_to_body_ratio: "1:7 to 1:8 for adult characters; preserve age and build"
        limbs: "elegant, elongated without losing character-specific anatomy"
        hands_feet: "readable, selectively detailed"
      rendering:
        line_style: "thin, variable, overlapping and deliberately incomplete black pen contours"
        shading: "irregular flat washes, selective color blocks, white paper gaps, occasional color outside contours"
        detail_level: "selective; simplify incidental detail rather than identity anchors"
      expression_rules:
        exaggeration: "low; delicate minimalist anime faces"
      pose_rules:
        style: "relaxed asymmetrical editorial fashion poses, natural gestures"
      tone: "airy, sophisticated, cozy, sketchbook-like"
      rules:
        - preserve canonical hair, eyes, body build, silhouette and signature motifs
        - use generous white negative space and sparse abstract color accents
        - avoid polished cel shading, glossy gradients, uniform outlines and fully rendered backgrounds

    polished_anime_key_art:
      description: "High-finish modern anime promotional illustration; deliberate contrast to loose_ink_fashion (anti-style)."
      proportions:
        head_to_body_ratio: "canonical proportions; preserve age and build"
        limbs: "natural anime anatomy with precise silhouettes"
        hands_feet: "fully drawn"
      rendering:
        line_style: "clean, controlled, continuous tapered digital contours"
        shading: "crisp cel shadows with controlled soft gradients, specular highlights and rim light"
        detail_level: "high; finished materials and coherent environmental detail"
      expression_rules:
        exaggeration: "moderate; clear polished anime facial features"
      pose_rules:
        style: "confident promotional poses; match pose when comparing styles"
      tone: "vibrant, cinematic, contemporary commercial key art"
      rules:
        - preserve canonical identity and all signature costume motifs
        - use saturated character-specific accents and fully filled color regions
        - use coherent directional lighting and a designed environment
        - avoid broken sketch contours, unpainted gaps, accidental color bleed and loose watercolor washes
