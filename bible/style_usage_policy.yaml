# Where each style variant (defined in art_style.yaml) is allowed to appear.
# This policy exists to prevent tone drift: chibi is a comedic instrument,
# not a replacement for the base character design.

style_usage_policy:
  default_manga:
    allowed_in:
      - main story panels
      - character sheets
      - promotional key art

  chibi:
    allowed_in:
      - reaction panels
      - comedic inserts
      - omake pages
      - chapter end jokes
      - stickers and emoji assets
    avoid_in:
      - serious dramatic climaxes
      - lore-critical reveal scenes

  pixel_arcade_sf2:
    allowed_in:
      - arcade-inspired promotional sprites
      - original pixel-game scenes
      - animation proof-of-concepts after human approval
      - style-specific pixel reference sheets
    avoid_in:
      - silently replacing approved Season 1 manga art
      - treating photo pixelation as final master artwork
      - visually copying Street Fighter II character sprites or assets
      - shipping unapproved batch sprite sheets

  pixel_8bit_nes:
    allowed_in:
      - retro-console concept scenes
      - 8-bit style character sprites
      - low-resolution game mock-ups
      - stylized nostalgic tutorials
    avoid_in:
      - representing creative sprites as NES-hardware-verified
      - using 16-bit arcade shading and detailed anatomy
      - shrinking finished manga art with automatic quantization
      - overwriting default_manga or chibi approved assets

  live_action_cinematic:
    allowed_in:
      - fictional adult live-action concept casting
      - cinematic science-fiction character stills
      - actor wardrobe and performance reference sheets
    avoid_in:
      - passing fictional images off as documentary photographs
      - real executive likeness or celebrity casting without consent
      - changing actor face structure to fit a camera angle
      - making costumes that have no physically workable construction
      - overwriting canonical manga character art

  live_action_cosplay:
    allowed_in:
      - real-world convention costume planning
      - neutral studio cosplay photography
      - costume making tutorials and material boards
    avoid_in:
      - fantastical floating VFX armor disguised as practical build
      - unsourced price estimates or unsupported safety claims
      - changing age portrayal or exposing child characters
      - real-person impersonations or undocumented model releases
      - overwriting approved Season 1 character art

  live_action_hyperreal_fantasy:
    allowed_in:
      - original fantasy key art
      - dramatic semiconductor technology visual metaphors
      - VFX studies with source and effect layers
    avoid_in:
      - changing actor identity under intense light or FX
      - disguising effects as real documentary photos
      - opaque one-layer source that cannot be repaired
      - replacing practical silhouette cues with generic glowing armor
      - implying any real person's endorsement or likeness

  cel_shaded_3d:
    allowed_in:
      - character model and shader boards
      - 3D turnaround previews
      - manga-inspired cel-rendered scenes
      - future 3D animation sources after rig review
    avoid_in:
      - treating a shader sample as an approved actor model
      - photoreal skin and gradients replacing flat manga shadow planes
      - changing recognizable facial structure or signature props
      - claiming VRM compatibility without export/runtime validation
      - overwriting existing Season 1 character art
